name: Update events (F1 / tennis)

# Manual only. AllSportDB's free key expires every 30 days, so this must not run on a schedule:
# renew the key on allsportdb.com, update the repository secret ALLSPORTDB_KEY
# (Settings -> Secrets and variables -> Actions), then run this workflow from the Actions tab.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run build_events.py
        env:
          ALLSPORTDB_KEY: ${{ secrets.ALLSPORTDB_KEY }}
        run: python build_events.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add events_raw.json events_data.json fixtures.js cities_cache.json venues_cache.json flags/
          git diff --cached --quiet && echo "Nothing changed" && exit 0
          git commit -m "Update events $(date -u +%Y-%m-%d)"
          git push
