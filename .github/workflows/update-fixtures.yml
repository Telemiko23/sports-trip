name: Update fixtures

on:
  schedule:
    # 05:00 UTC daily (07:00/08:00 Israel time depending on DST) - adjust freely
    - cron: '0 5 * * *'
  workflow_dispatch: {}  # lets you trigger a run by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run build_fixtures.py
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python build_fixtures.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fixtures.js cities_cache.json venues_cache.json logos/ comp_logos/
          git diff --cached --quiet && echo "Nothing changed" && exit 0
          git commit -m "Auto-update fixtures $(date -u +%Y-%m-%d)"
          git push
