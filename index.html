<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.tile.openstreetmap.org https://media.api-sports.io; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>ToSport</title>
<meta name="theme-color" content="#0B1220">
<meta name="color-scheme" content="dark">
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="brand/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="analytics.js"></script>
</head>
<body>
<a class="skip-link" href="#main" id="skipLink">דלג לתוכן הראשי</a>
<header class="site-header"><div class="site-header-in">
  <h1 class="brand"><a class="brand-logo" href="./"><img src="brand/tosport-logo-blue-white.svg" width="166" height="36" alt="ToSport - דף הבית"></a></h1>
</div></header>

<nav id="mainNav" class="mainnav" aria-label="ניווט ראשי"></nav>

<main id="main" tabindex="-1">
  <section id="onboarding" class="onboarding" aria-labelledby="obTitle" hidden></section>
  <div id="app" class="app" hidden>
    <section id="view-search" class="view" role="tabpanel" aria-labelledby="tab-search"></section>
    <section id="view-plan" class="view" role="tabpanel" aria-labelledby="tab-plan" hidden></section>
    <section id="view-trip" class="view" role="tabpanel" aria-labelledby="tab-trip" hidden></section>
    <aside id="tripPeek" class="peek" hidden></aside>
  </div>
  <noscript><p class="empty">האתר דורש JavaScript כדי לחפש אירועים ולהרכיב טיול.</p></noscript>
</main>

<footer class="credits" id="credits"></footer>

<dialog id="evDialog" class="sheet" aria-labelledby="evTitle"></dialog>
<dialog id="fdDialog" class="sheet" aria-labelledby="fdTitle"></dialog>
<dialog id="ctxDialog" class="sheet" aria-labelledby="ctxTitle"></dialog>
<dialog id="impDialog" class="sheet narrow" aria-labelledby="impTitle"></dialog>
<dialog id="legalDialog" class="sheet narrow" aria-labelledby="legalTitle"></dialog>
<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="live" class="sr-only" aria-live="polite" aria-atomic="true"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script src="brand.js"></script>
<script src="fixtures.js"></script>
<script src="airports.js"></script>
<script src="js/i18n.js"></script>
<script src="js/model.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/combo.js"></script>
<script src="planner.js"></script>
<script src="js/planview.js"></script>
<script src="app.js"></script>
</body>
</html>
